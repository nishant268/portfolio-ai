services:

  # ── Backend: FastAPI (Docker) ─────────────────────────────────────────────────
  - type: web
    name: portfolio-ai-backend
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    envVars:
      - key: DATA_DIR
        value: /data
      - key: FRONTEND_URL
        value: https://portfolio-ai-frontend.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ZERODHA_API_KEY
        sync: false
      - key: ZERODHA_API_SECRET
        sync: false
      - key: ZERODHA_ACCESS_TOKEN
        sync: false

    disk:
      name: portfolio-ai-data
      mountPath: /data
      sizeGB: 1

  # ── Frontend: Next.js (Docker) ────────────────────────────────────────────────
  - type: web
    name: portfolio-ai-frontend
    runtime: docker
    plan: free
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /

    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://portfolio-ai-backend.onrender.com
